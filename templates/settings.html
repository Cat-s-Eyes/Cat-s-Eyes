<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>설정 · 고양이 돌봄</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">설정</p>
      <h1>시간과 구역</h1>
    </div>
    <a class="text-link" href="/">오늘</a>
  </header>

  <form id="settings" class="panel">
    <label>밥 시간
      <input name="meal_times" inputmode="numeric" placeholder="08:00,18:00" required>
    </label>
    <p class="hint">쉼표로 구분합니다. 예: 08:00,18:00</p>
    <div class="pair">
      <label>놀이 시각
        <input name="play_time" type="time" required>
      </label>
      <label>놀이 분
        <input name="play_minutes" type="number" min="1" max="180" required>
      </label>
    </div>
    <div class="pair">
      <label>청소 기준 횟수
        <input name="clean_threshold" type="number" min="1" max="50" required>
      </label>
      <label>머문 시간 기준(초)
        <input name="stay_seconds" type="number" min="1" max="600" required>
      </label>
    </div>
    <button type="submit">설정 저장</button>
    <p id="settings-msg" class="hint" role="status"></p>
  </form>

  <section class="panel">
    <h2>구역</h2>
    <p class="hint">사진 위에서 드래그해 사각형을 만듭니다. 좌표는 사진 크기 대비 0~1로 저장됩니다.</p>
    <div class="zone-pick">
      <button type="button" id="pick-bowl" class="chip on">밥그릇</button>
      <button type="button" id="pick-litter" class="chip">화장실</button>
      <button type="button" id="shoot" class="chip">사진 다시 찍기</button>
    </div>
    <div class="frame" id="frame">
      <img id="shot" alt="카메라 최근 사진">
      <canvas id="zone"></canvas>
      <p id="no-shot" class="empty">아직 사진이 없습니다. 사진 다시 찍기를 눌러 주세요.</p>
    </div>
    <p class="hint" id="zone-text"></p>
    <button type="button" id="save-zones">구역 저장</button>
    <p id="zone-msg" class="hint" role="status"></p>
  </section>

  <script>
    const form = document.getElementById("settings");
    const shot = document.getElementById("shot");
    const canvas = document.getElementById("zone");
    const frame = document.getElementById("frame");
    const noShot = document.getElementById("no-shot");
    const ctx = canvas.getContext("2d");
    const zones = {bowl: null, litter: null};
    let active = "bowl";
    let drag = null;

    const COLOR = {
      bowl: ["rgba(196, 107, 45, 0.35)", "#c46b2d"],
      litter: ["rgba(47, 95, 122, 0.35)", "#2f5f7a"],
    };
    const LABEL = {bowl: "밥그릇", litter: "화장실"};

    function msg(id, text, bad) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.classList.toggle("bad", !!bad);
    }

    function fillSettings(data) {
      for (const [key, value] of Object.entries(data)) {
        if (form.elements[key]) form.elements[key].value = value;
      }
    }

    function resize() {
      const width = shot.clientWidth;
      const height = shot.clientHeight;
      if (!width || !height) return;
      canvas.width = width;
      canvas.height = height;
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const name of ["bowl", "litter"]) {
        const box = zones[name];
        if (!box) continue;
        const x = box.x1 * canvas.width;
        const y = box.y1 * canvas.height;
        const w = (box.x2 - box.x1) * canvas.width;
        const h = (box.y2 - box.y1) * canvas.height;
        ctx.fillStyle = COLOR[name][0];
        ctx.strokeStyle = COLOR[name][1];
        ctx.lineWidth = 2;
        ctx.fillRect(x, y, w, h);
        ctx.strokeRect(x, y, w, h);
      }
      const lines = [];
      for (const name of ["bowl", "litter"]) {
        const box = zones[name];
        if (!box) continue;
        lines.push(`${LABEL[name]} ${box.x1.toFixed(2)}, ${box.y1.toFixed(2)} – ${box.x2.toFixed(2)}, ${box.y2.toFixed(2)}`);
      }
      document.getElementById("zone-text").textContent = lines.join("   ");
    }

    function point(event) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
      const y = Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height));
      return [x, y];
    }

    function showShot() {
      shot.hidden = false;
      canvas.hidden = false;
      noShot.hidden = true;
      shot.src = "/snapshot.jpg?t=" + Date.now();
    }

    shot.addEventListener("load", () => {
      shot.hidden = false;
      canvas.hidden = false;
      noShot.hidden = true;
      resize();
    });
    shot.addEventListener("error", () => {
      shot.hidden = true;
      canvas.hidden = true;
      noShot.hidden = false;
    });

    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture(event.pointerId);
      const [x, y] = point(event);
      drag = {x, y};
      zones[active] = {x1: x, y1: y, x2: x, y2: y};
      draw();
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!drag) return;
      const [x, y] = point(event);
      zones[active] = {
        x1: Math.min(drag.x, x), y1: Math.min(drag.y, y),
        x2: Math.max(drag.x, x), y2: Math.max(drag.y, y),
      };
      draw();
    });
    canvas.addEventListener("pointerup", () => { drag = null; });
    canvas.addEventListener("pointercancel", () => { drag = null; });
    window.addEventListener("resize", resize);

    document.getElementById("pick-bowl").onclick = () => pick("bowl");
    document.getElementById("pick-litter").onclick = () => pick("litter");

    function pick(name) {
      active = name;
      document.getElementById("pick-bowl").classList.toggle("on", name === "bowl");
      document.getElementById("pick-litter").classList.toggle("on", name === "litter");
    }

    document.getElementById("shoot").onclick = async (event) => {
      const button = event.currentTarget;
      button.disabled = true;
      msg("zone-msg", "찍는 중…", false);
      try {
        const res = await fetch("/api/snapshot", {method: "POST"});
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          msg("zone-msg", body.error || "사진을 찍지 못했습니다.", true);
          return;
        }
        msg("zone-msg", "사진을 바꿨습니다. 구역을 다시 그려 주세요.", false);
        showShot();
      } catch (err) {
        msg("zone-msg", "사진을 찍지 못했습니다. 페이지를 새로고침한 뒤 다시 눌러 주세요.", true);
      } finally {
        button.disabled = false;
      }
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      const res = await fetch("/api/settings", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        msg("settings-msg", body.error || "저장하지 못했습니다.", true);
        return;
      }
      fillSettings(body);
      msg("settings-msg", "저장했습니다.", false);
    });

    document.getElementById("save-zones").onclick = async () => {
      const payload = {};
      for (const name of ["bowl", "litter"]) {
        if (zones[name]) payload[name] = zones[name];
      }
      const res = await fetch("/api/zones", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({zones: payload}),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        msg("zone-msg", body.error || "구역을 저장하지 못했습니다.", true);
        return;
      }
      Object.assign(zones, {bowl: null, litter: null}, body.zones);
      draw();
      msg("zone-msg", "구역을 저장했습니다.", false);
    };

    Promise.all([fetch("/api/settings"), fetch("/api/zones")]).then(async ([s, z]) => {
      fillSettings(await s.json());
      const saved = (await z.json()).zones || {};
      Object.assign(zones, saved);
      showShot();
    }).catch(() => msg("settings-msg", "설정을 불러오지 못했습니다.", true));
  </script>
</body>
</html>
